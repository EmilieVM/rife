<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rife Pro | Universal Frequency Research</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.3);
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --sub-text: #64748b;
            --border: #e2e8f0;
            --pill-bg: #e0e7ff;
            --pill-text: #4338ca;
            --accent: #10b981;
            --stop: #ef4444;
        }

        body.dark-mode {
            --bg: #020617;
            --card-bg: #0f172a;
            --text: #f1f5f9;
            --sub-text: #94a3b8;
            --border: #1e293b;
            --pill-bg: #1e1b4b;
            --pill-text: #e0e7ff;
        }

        body { 
            font-family: 'Inter', -apple-system, system-ui, sans-serif; 
            max-width: 850px; 
            margin: 0 auto; 
            padding: 20px; 
            background: var(--bg); 
            color: var(--text);
            transition: all 0.3s ease;
        }

        /* Header Navigation */
        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 20px; font-weight: 800; color: var(--primary); }
        .btn { padding: 10px 18px; border-radius: 12px; cursor: pointer; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-weight: 600; text-decoration: none; font-size: 13px; }
        .btn-support { background: var(--primary); color: white; border: none; box-shadow: 0 4px 10px var(--primary-glow); }

        /* 1. Search Section (TOP) */
        .search-section { margin-bottom: 20px; }
        .search-box { 
            width: 100%; padding: 18px 24px; font-size: 16px; border: 2px solid var(--border); 
            border-radius: 18px; background: var(--card-bg); color: var(--text); box-sizing: border-box;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .history-bar { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; scrollbar-width: none; }
        .history-item { background: var(--card-bg); padding: 6px 14px; border-radius: 99px; cursor: pointer; white-space: nowrap; font-size: 12px; border: 1px solid var(--border); color: var(--sub-text); }

        /* 2. Dashboard (MIDDLE) */
        .dashboard {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px;
            padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 11px; font-weight: 700; color: var(--sub-text); text-transform: uppercase; }
        input[type="range"] { accent-color: var(--primary); cursor: pointer; width: 100%; }
        select { padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }

        .status-display { background: var(--bg); padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .status-text { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; background: #94a3b8; border-radius: 50%; }
        .active .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .stop-btn { background: var(--stop); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; display: none; }

        /* 3. Results Section (BOTTOM) */
        .card { background: var(--card-bg); border-radius: 18px; padding: 20px; margin-bottom: 15px; border: 1px solid var(--border); }
        .card h3 { margin: 0 0 5px 0; font-size: 17px; color: var(--primary); }
        .card p { margin: 0 0 12px 0; font-size: 13px; color: var(--sub-text); }

        /* Highlighting Logic */
        .freq-btn { 
            background: var(--pill-bg); color: var(--pill-text); padding: 10px 16px; border-radius: 10px; 
            margin: 4px 4px 4px 0; font-family: monospace; font-weight: 700; cursor: pointer; border: 2px solid transparent; 
            transition: all 0.2s;
        }
        .freq-btn.is-playing { 
            background: var(--primary) !important; color: white !important; 
            box-shadow: 0 0 12px var(--primary-glow); border-color: white; transform: scale(1.05);
        }

        .disclaimer { font-size: 11px; color: var(--sub-text); text-align: center; margin-top: 50px; opacity: 0.6; }
    </style>
</head>
<body>

    <header class="nav-header">
        <div class="logo">RIFE PRO</div>
        <div style="display:flex; gap:10px;">
            <button class="btn" onclick="toggleDarkMode()" id="darkToggle">🌙 Mode</button>
            <a href="https://buy.stripe.com/7sYdRbglJcHk3s6fzQ8ww01" target="_blank" class="btn btn-support">Support</a>
        </div>
    </header>

    <div class="search-section">
        <input type="text" id="searchInput" class="search-box" placeholder="Search conditions or Hz (e.g. Hives, 528)...">
        <div id="historyBar" class="history-bar"></div>
    </div>

    <div class="dashboard">
        <div class="control-group">
            <label>Master Volume</label>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="control-group">
            <label>Duration</label>
            <select id="duration">
                <option value="continuous" selected>Continuous Play</option>
                <option value="30">30 Seconds</option>
                <option value="600">10 Minutes</option>
                <option value="1200">20 Minutes</option>
                <option value="1800">30 Minutes</option>
            </select>
        </div>
        <div class="control-group">
            <label>Signal Status</label>
            <div id="statusBox" class="status-display">
                <div class="status-text"><div class="dot"></div><span id="statusTxt">Standby</span></div>
                <button id="stopBtn" class="stop-btn" onclick="stopTone()">STOP</button>
            </div>
        </div>
    </div>

    <div id="results"></div>

    <p class="disclaimer">Laboratory Sine Wave Research Tool. For research purposes only.</p>

    <script>
        // --- AUDIO ENGINE ---
        let audioCtx = null;
        let masterGain = null;
        let currentOsc = null;
        let activeFreq = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.connect(audioCtx.destination);
                // Set initial volume from the slider
                const vol = document.getElementById('volume').value;
                masterGain.gain.setValueAtTime(vol, audioCtx.currentTime);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // Live Volume Control
        document.getElementById('volume').addEventListener('input', (e) => {
            initAudio(); // Ensure context is awake
            if (masterGain) {
                masterGain.gain.setTargetAtTime(e.target.value, audioCtx.currentTime, 0.03);
            }
        });

        const staticData = [
            { "name": "Solfeggio: 174 Hz", "description": "Pain Reduction", "frequencies": [174] },
            { "name": "Solfeggio: 528 Hz", "description": "DNA Repair", "frequencies": [528] },
            { "name": "Solfeggio: 963 Hz", "description": "Divine Consciousness", "frequencies": [963] },
            { "name": "Hives Protocol", "description": "Skin Rash / Allergy", "frequencies": [1800, 880, 787, 727, 522, 146, 4.9] }
        ];

        let db = [];
        let history = JSON.parse(localStorage.getItem('rife_history')) || [];
        let timerId = null;

        function stopTone() {
            if (currentOsc) {
                currentOsc.stop();
                currentOsc.disconnect();
                currentOsc = null;
            }
            if (timerId) clearTimeout(timerId);
            
            activeFreq = null;
            document.querySelectorAll('.freq-btn').forEach(b => b.classList.remove('is-playing'));
            document.getElementById('statusBox').classList.remove('active');
            document.getElementById('statusTxt').innerText = 'Standby';
            document.getElementById('stopBtn').style.display = 'none';
        }

        function playTone(freq, btn) {
            initAudio(); // Wake up the engine
            
            if (activeFreq === freq) {
                stopTone();
                return;
            }
            
            stopTone(); // Clean up current

            currentOsc = audioCtx.createOscillator();
            currentOsc.type = 'sine';
            currentOsc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            currentOsc.connect(masterGain);
            currentOsc.start();

            activeFreq = freq;
            btn.classList.add('is-playing');
            document.getElementById('statusBox').classList.add('active');
            document.getElementById('statusTxt').innerText = `${freq}Hz Active`;
            document.getElementById('stopBtn').style.display = 'block';

            // Session Timer
            const durValue = document.getElementById('duration').value;
            if (durValue !== 'continuous') {
                const dur = parseFloat(durValue);
                timerId = setTimeout(() => { stopTone(); }, dur * 1000);
            }
        }

        // --- SEARCH & UI ---
        async function init() {
            try {
                const res = await fetch('frequencies.json');
                const jsonData = await res.json();
                db = [...staticData, ...jsonData];
            } catch (e) { db = staticData; }
            render(db);
            updateHistoryUI();
        }

        function render(data) {
            const container = document.getElementById('results');
            container.innerHTML = data.map(item => `
                <div class="card">
                    <h3>${item.name}</h3>
                    <p>${item.description || ''}</p>
                    <div style="display:flex; flex-wrap:wrap;">
                        ${(item.frequencies || []).map(f => `
                            <button class="freq-btn ${activeFreq === f ? 'is-playing' : ''}" 
                                    onclick="playTone(${f}, this)">
                                ${f}Hz
                            </button>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const filtered = db.filter(i => {
                const text = `${i.name} ${i.description} ${(i.keywords || []).join(' ')} ${(i.frequencies || []).join(' ')}`.toLowerCase();
                return text.includes(term);
            });
            render(filtered);
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.value.trim() !== '') {
                const val = e.target.value.trim();
                if (!history.includes(val)) {
                    history.unshift(val);
                    history = history.slice(0, 6);
                    localStorage.setItem('rife_history', JSON.stringify(history));
                    updateHistoryUI();
                }
            }
        });

        function updateHistoryUI() {
            document.getElementById('historyBar').innerHTML = history.map(h => `<span class="history-item" onclick="runHistory('${h}')">${h}</span>`).join('');
        }

        function runHistory(term) {
            document.getElementById('searchInput').value = term;
            document.getElementById('searchInput').dispatchEvent(new Event('input'));
        }

        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            document.getElementById('darkToggle').innerText = isDark ? '☀️ Light' : '🌙 Dark';
            localStorage.setItem('rife_theme', isDark ? 'dark' : 'light');
        }
        if (localStorage.getItem('rife_theme') === 'dark') toggleDarkMode();

        init();
    </script>
</body>
</html>
