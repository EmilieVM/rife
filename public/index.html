<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rife Pro | Precision Frequency Suite</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }
        body.dark-mode {
            --bg: #020617; --card: #0f172a; --text: #f1f5f9; --border: #1e293b;
        }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            max-width: 600px; margin: 0 auto; padding: 20px; 
            background: var(--bg); color: var(--text); transition: background 0.2s;
        }

        /* Header & Support */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 22px; font-weight: 900; color: var(--primary); letter-spacing: -1px; }
        .nav-btns { display: flex; gap: 10px; }
        .btn { padding: 10px 16px; border-radius: 12px; cursor: pointer; border: 1px solid var(--border); font-weight: 700; font-size: 13px; text-decoration: none; transition: 0.2s; background: var(--card); color: var(--text); }
        .btn-support { background: var(--primary); color: white; border: none; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        /* 1. SEARCH AT TOP */
        .search-box { 
            width: 100%; padding: 18px; border-radius: 16px; border: 2px solid var(--border);
            background: var(--card); color: var(--text); font-size: 16px; margin-bottom: 20px; box-sizing: border-box; outline: none;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .search-box:focus { border-color: var(--primary); }

        /* 2. VOLUME DASHBOARD BELOW SEARCH */
        .dashboard { 
            background: var(--card); border: 2px solid var(--primary); 
            padding: 22px; border-radius: 24px; margin-bottom: 25px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }
        .vol-header { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 12px; font-size: 14px; }
        #volDisplay { color: var(--primary); font-family: monospace; font-size: 18px; }
        
        input[type="range"] { 
            width: 100%; height: 12px; accent-color: var(--primary); cursor: pointer; 
            background: var(--border); border-radius: 10px; appearance: none;
        }

        /* 3. RESULTS CARDS */
        .card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 20px; margin-bottom: 15px; }
        .card h3 { margin: 0 0 8px 0; font-size: 18px; color: var(--primary); }
        .card p { margin: 0 0 15px 0; font-size: 13px; opacity: 0.7; line-height: 1.4; }
        
        .freq-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .freq-btn { 
            padding: 12px 18px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-weight: 700; cursor: pointer;
            transition: 0.2s; font-family: monospace; font-size: 14px;
        }

        /* INDIGO HIGHLIGHT */
        .freq-btn.active-signal { 
            background: var(--primary) !important; color: white !important;
            border-color: var(--primary); box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
            transform: scale(1.05);
        }

        .status-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .stop-btn { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; display: none; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">RIFE PRO</div>
        <div class="nav-btns">
            <button onclick="document.body.classList.toggle('dark-mode')" class="btn">🌓 Mode</button>
            <a href="https://buy.stripe.com/7sYdRbglJcHk3s6fzQ8ww01" target="_blank" class="btn btn-support">Support</a>
        </div>
    </header>

    <input type="text" id="search" class="search-box" placeholder="Search (e.g. Abdominal, Hives, Solfeggio)...">

    <div class="dashboard">
        <div class="vol-header">
            <span>MASTER VOLUME</span>
            <span id="volDisplay">50%</span>
        </div>
        <input type="range" id="volControl" min="0" max="1" step="0.01" value="0.5">
        
        <div class="status-footer">
            <span id="statusNote" style="font-size: 11px; font-weight: 700; opacity: 0.6;">SYSTEM READY</span>
            <button id="stopBtn" class="stop-btn" onclick="stopAll()">STOP SIGNAL</button>
        </div>
    </div>

    <div id="results"></div>

    <script>
        let audioCtx = null;
        let masterGain = null;
        let currentOsc = null;
        let activeHz = null;

        // Wake Audio System
        function wakeAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.connect(audioCtx.destination);
                masterGain.gain.value = document.getElementById('volControl').value;
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // Live Volume Sync
        document.getElementById('volControl').addEventListener('input', function() {
            wakeAudio();
            const val = this.value;
            document.getElementById('volDisplay').innerText = Math.round(val * 100) + '%';
            if (masterGain) {
                // Direct assignment for most robust phone/laptop support
                masterGain.gain.value = val;
            }
        });

        function stopAll() {
            if (currentOsc) {
                currentOsc.stop();
                currentOsc.disconnect();
                currentOsc = null;
            }
            activeHz = null;
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('statusNote').innerText = 'SIGNAL STOPPED';
            document.querySelectorAll('.freq-btn').forEach(b => b.classList.remove('active-signal'));
        }

        function play(hz) {
            wakeAudio();
            if (activeHz === hz) { stopAll(); return; }
            stopAll();

            currentOsc = audioCtx.createOscillator();
            currentOsc.type = 'sine';
            currentOsc.frequency.value = hz;
            
            currentOsc.connect(masterGain);
            // Re-sync volume on start
            masterGain.gain.value = document.getElementById('volControl').value;
            
            currentOsc.start();
            activeHz = hz;

            document.getElementById('statusNote').innerText = 'PLAYING: ' + hz + ' HZ';
            document.getElementById('stopBtn').style.display = 'block';
            
            updateBtnHighlights();
        }

        function updateBtnHighlights() {
            document.querySelectorAll('.freq-btn').forEach(btn => {
                if(parseFloat(btn.innerText) === activeHz) {
                    btn.classList.add('active-signal');
                } else {
                    btn.classList.remove('active-signal');
                }
            });
        }

        // --- DATA ---
        let mainDb = [];
        async function fetchDb() {
            try {
                const r = await fetch('frequencies.json');
                mainDb = await r.json();
            } catch(e) {
                mainDb = [{name:"Solfeggio 528", frequencies:[528], description:"Transformation"}];
            }
            render(mainDb);
        }

        function render(data) {
            const container = document.getElementById('results');
            container.innerHTML = data.map(item => `
                <div class="card">
                    <h3>${item.name}</h3>
                    <p>${item.description || ''}</p>
                    <div class="freq-grid">
                        ${item.frequencies.map(f => `
                            <button class="freq-btn ${activeHz === f ? 'active-signal' : ''}" 
                                    onclick="play(${f})">${f}</button>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('search').oninput = function() {
            const t = this.value.toLowerCase();
            const filtered = mainDb.filter(i => 
                i.name.toLowerCase().includes(t) || 
                (i.keywords && i.keywords.some(k => k.toLowerCase().includes(t)))
            );
            render(filtered);
            updateBtnHighlights();
        };

        fetchDb();
    </script>
</body>
</html>
