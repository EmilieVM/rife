<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rife Frequency Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .frequency-card { transition: all 0.2s ease; }
        .frequency-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        .btn-active { 
            background-color: #10b981 !important; 
            color: white !important;
            border-color: #059669 !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
        }

        /* Dark Mode Core */
        body.dark-mode { background-color: #0f172a; color: #f8fafc; }
        .dark-mode .bg-white { background-color: #1e293b !important; color: #f8fafc; border-color: #334155; }
        .dark-mode .text-slate-800 { color: #f1f5f9; }
        .dark-mode .text-slate-500 { color: #94a3b8; }
        .dark-mode input, .dark-mode select { background-color: #0f172a; color: white; border: 1px solid #475569; }
        .dark-mode .bg-indigo-50 { background-color: #312e81; color: #e0e7ff; border-color: #4338ca; }
        .dark-mode header { background-color: #1e1b4b; }
        
        /* High Contrast History Buttons (Dark Mode) */
        .dark-mode .history-pill { 
            background-color: #312e81; 
            color: #c7d2fe; 
            border: 1px solid #4338ca;
        }
        .dark-mode .history-pill:hover { background-color: #4338ca; color: white; }
        
        .dark-mode .btn-active { background-color: #6366f1 !important; border-color: #818cf8 !important; }
    </style>
</head>
<body class="text-slate-900 font-sans transition-colors duration-300">

    <header class="bg-indigo-900 text-white p-8 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-4xl font-extrabold tracking-tight">Rife Frequency Finder</h1>
                <p class="mt-2 text-indigo-100 text-lg">Tone Generator & Search</p>
            </div>
            <button onclick="toggleDarkMode()" class="p-3 rounded-full bg-indigo-800 hover:bg-indigo-700 border border-indigo-500 transition-all shadow-lg">
                <span id="darkIcon">🌙</span>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6">
        <div class="mb-2">
            <input type="text" id="searchInput" placeholder="Search conditions (e.g. 'Pain', 'Detox')..." 
                class="w-full p-5 rounded-2xl border-0 shadow-xl focus:ring-4 focus:ring-indigo-500/20 text-xl outline-none transition-all">
        </div>

        <div class="flex items-center justify-between mb-6 px-1">
            <div id="historyContainer" class="flex flex-wrap gap-2">
                </div>
            <button onclick="clearHistory()" id="clearHistoryBtn" class="hidden text-xs font-bold text-slate-40
