<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rife Pro Explorer | Research Tool</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #ffffff;
            --card-bg: #f8fafc;
            --text: #1e293b;
            --sub-text: #64748b;
            --border: #e2e8f0;
            --pill-bg: #e0e7ff;
            --pill-text: #4338ca;
        }

        body.dark-mode {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --sub-text: #94a3b8;
            --border: #334155;
            --pill-bg: #312e81;
            --pill-text: #e0e7ff;
        }

        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 20px; 
            background: var(--bg); 
            color: var(--text);
            transition: background 0.2s, color 0.2s;
        }

        /* Header & Nav */
        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .controls { display: flex; gap: 10px; align-items: center; }

        .btn {
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-stripe { background: #635bff; color: white; border: none; transition: opacity 0.2s; }
        .btn-stripe:hover { opacity: 0.9; }

        /* Search UI */
        .search-box { 
            width: 100%; 
            padding: 16px; 
            font-size: 18px; 
            border: 2px solid var(--border); 
            border-radius: 14px; 
            background: var(--card-bg);
            color: var(--text);
            margin-bottom: 8px;
            box-sizing: border-box;
        }

        .history-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 5px 0 20px 0;
            font-size: 0.85rem;
        }

        .history-item {
            background: var(--border);
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            color: var(--sub-text);
        }

        /* Results */
        .card { 
            background: var(--card-bg); 
            border-radius: 14px; 
            padding: 20px; 
            margin-bottom: 15px; 
            border: 1px solid var(--border);
        }

        .freq-pill { 
            display: inline-block;
            background: var(--pill-bg); 
            color: var(--pill-text); 
            padding: 5px 10px; 
            border-radius: 6px; 
            margin: 4px 4px 4px 0;
            font-family: monospace;
            font-weight: bold;
        }

        .disclaimer {
            font-size: 0.7rem;
            color: var(--sub-text);
            text-align: center;
            margin-top: 40px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="nav-header">
        <h2 style="margin:0">Rife Pro</h2>
        <div class="controls">
            <button class="btn" onclick="toggleDarkMode()" id="darkToggle">🌙 Mode</button>
            <a href="https://buy.stripe.com/7sYdRbglJcHk3s6fzQ8ww01" target="_blank" class="btn btn-stripe">Subscribe</a>
        </div>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="Search by name, frequency, or keyword...">
    
    <div id="historyBar" class="history-bar"></div>

    <div id="results"></div>

    <div class="disclaimer">
        <b>Notice:</b> Experimental bio-frequency research tool. 
        Not for medical use. No medical claims are made or implied.
    </div>

    <script>
        let db = [];
        let history = JSON.parse(localStorage.getItem('rife_history')) || [];

        // Dark Mode
        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            document.getElementById('darkToggle').innerText = isDark ? '☀️ Light' : '🌙 Dark';
            localStorage.setItem('rife_theme', isDark ? 'dark' : 'light');
        }
        if (localStorage.getItem('rife_theme') === 'dark') toggleDarkMode();

        // Load Frequencies
        async function init() {
            try {
                // Adjusting path to relative for wider compatibility
                const res = await fetch('frequencies.json');
                if(!res.ok) throw new Error();
                db = await res.json();
                render(db);
                updateHistoryUI();
            } catch (e) {
                document.getElementById('results').innerHTML = `<p style="color:red">Error: Database not found. Ensure frequencies.json is in the same folder as index.html.</p>`;
            }
        }

        function render(data) {
            const container = document.getElementById('results');
            if (data.length === 0) {
                container.innerHTML = "<p style='text-align:center; padding:20px;'>No matching frequencies found.</p>";
                return;
            }
            container.innerHTML = data.map(item => `
                <div class="card">
                    <h3 style="margin:0 0 8px 0; color:var(--primary)">${item.name}</h3>
                    <div style="font-size:0.9rem; margin-bottom:10px">${item.description || 'General Research Protocol'}</div>
                    <div>${item.frequencies.map(f => `<span class="freq-pill">${f}Hz</span>`).join('')}</div>
                </div>
            `).join('');
        }

        const input = document.getElementById('searchInput');

        // Search logic
        input.addEventListener('input', () => {
            const term = input.value.toLowerCase().trim();
            const filtered = db.filter(i => 
                i.name.toLowerCase().includes(term) || 
                (i.keywords && i.keywords.some(k => k.toLowerCase().includes(term))) ||
                i.frequencies.some(f => f.toString().includes(term))
            );
            render(filtered);
        });

        // Add to history on Enter
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && input.value.trim() !== '') {
                addToHistory(input.value.trim());
            }
        });

        function addToHistory(term) {
            if (!history.includes(term)) {
                history.unshift(term);
                history = history.slice(0, 6);
                localStorage.setItem('rife_history', JSON.stringify(history));
                updateHistoryUI();
            }
        }

        function updateHistoryUI() {
            const bar = document.getElementById('historyBar');
            bar.innerHTML = history.map(h => `<span class="history-item" onclick="runHistory('${h}')">🕒 ${h}</span>`).join('');
        }

        function runHistory(term) {
            input.value = term;
            input.dispatchEvent(new Event('input'));
        }

        init();
    </script>
</body>
</html>
