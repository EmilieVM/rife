<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rife Pro | Universal Frequency Suite</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --sub-text: #64748b;
            --border: #e2e8f0;
            --pill-bg: #e0e7ff;
            --pill-text: #4338ca;
            --accent: #10b981;
            --stop: #ef4444;
        }

        body.dark-mode {
            --bg: #020617;
            --card-bg: #0f172a;
            --text: #f1f5f9;
            --sub-text: #94a3b8;
            --border: #1e293b;
            --pill-bg: #1e1b4b;
            --pill-text: #e0e7ff;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            max-width: 800px; margin: 0 auto; padding: 20px; 
            background: var(--bg); color: var(--text); transition: background 0.3s;
        }

        /* Nav */
        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); }
        .btn-group { display: flex; gap: 8px; }
        .btn { padding: 10px 16px; border-radius: 12px; cursor: pointer; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-weight: 600; text-decoration: none; font-size: 13px; }
        .btn-support { background: var(--primary); color: white; border: none; box-shadow: 0 4px 12px var(--primary-glow); }

        /* 1. SEARCH SECTION (TOP) */
        .search-section { margin-bottom: 20px; }
        .search-box { 
            width: 100%; padding: 18px 24px; font-size: 17px; border: 2px solid var(--border); 
            border-radius: 18px; background: var(--card-bg); color: var(--text); box-sizing: border-box;
            box-shadow: 0 4px 15px -5px rgba(0,0,0,0.05); outline: none;
        }
        .history-bar { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .history-item { background: var(--card-bg); padding: 5px 12px; border-radius: 99px; cursor: pointer; white-space: nowrap; font-size: 11px; border: 1px solid var(--border); color: var(--sub-text); }

        /* 2. DASHBOARD (MIDDLE) */
        .dashboard {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px;
            padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 11px; font-weight: 800; color: var(--sub-text); text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Fixed Volume Slider */
        .vol-header { display: flex; justify-content: space-between; }
        .vol-val { color: var(--primary); font-weight: 800; font-family: monospace; }
        input[type="range"] { accent-color: var(--primary); cursor: pointer; height: 10px; width: 100%; }

        select { padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-weight: 600; }

        .status-box { background: var(--bg); padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .status-info { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; }
        .dot { width: 10px; height: 10px; background: #cbd5e1; border-radius: 50%; }
        .active .dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .btn-stop { background: var(--stop); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; display: none; }

        /* 3. RESULTS (BOTTOM) */
        .card { background: var(--card-bg); border-radius: 18px; padding: 22px; margin-bottom: 15px; border: 1px solid var(--border); }
        .card h3 { margin: 0 0 4px 0; font-size: 18px; color: var(--primary); }
        .card p { margin: 0 0 15px 0; font-size: 13px; color: var(--sub-text); line-height: 1.4; }

        .freq-grid { display: flex; flex-wrap: wrap; gap: 6px; }
        .freq-btn { 
            background: var(--pill-bg); color: var(--pill-text); padding: 10px 14px; border-radius: 10px; 
            font-family: monospace; font-weight: 700; cursor: pointer; border: 2px solid transparent; 
            transition: all 0.2s; font-size: 13px;
        }
        /* ACTIVE HIGHLIGHT */
        .freq-btn.is-active { 
            background: var(--primary) !important; color: white !important; 
            box-shadow: 0 0 15px var(--primary-glow); border-color: white; transform: scale(1.05);
        }

        .disclaimer { font-size: 11px; color: var(--sub-text); text-align: center; margin-top: 50px; opacity: 0.6; line-height: 1.5; }
    </style>
</head>
<body>

    <header class="nav-header">
        <div class="logo">RIFE PRO</div>
        <div class="btn-group">
            <button class="btn" onclick="toggleDarkMode()" id="darkToggle">🌙 Mode</button>
            <a href="https://buy.stripe.com/7sYdRbglJcHk3s6fzQ8ww01" target="_blank" class="btn btn-support">Support</a>
        </div>
    </header>

    <div class="search-section">
        <input type="text" id="searchInput" class="search-box" placeholder="Search (Hives, DNA, Abdominal, 528)...">
        <div id="historyBar" class="history-bar"></div>
    </div>

    <div class="dashboard">
        <div class="control-group">
            <div class="vol-header"><label>Volume</label><span id="volDisp" class="vol-val">50%</span></div>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="control-group">
            <label>Timer</label>
            <select id="duration">
                <option value="continuous" selected>Continuous</option>
                <option value="30">30 Seconds</option>
                <option value="600">10 Minutes</option>
                <option value="1200">20 Minutes</option>
            </select>
        </div>
        <div class="control-group">
            <label>Signal</label>
            <div id="statusBox" class="status-box">
                <div class="status-info"><div class="dot"></div><span id="statusTxt">Standby</span></div>
                <button id="stopBtn" class="btn-stop" onclick="stopTone()">STOP</button>
            </div>
        </div>
    </div>

    <div id="results"></div>

    <div class="disclaimer">
        <b>Experimental Laboratory Tool.</b><br>
        Note: Frequencies below 40Hz may not be audible on standard mobile or laptop speakers.<br>
        Pure Sine Wave Generation. Not a medical device.
    </div>

    <script>
        // --- AUDIO ENGINE ---
        let audioCtx = null;
        let masterGain = null;
        let activeOsc = null;
        let currentHz = null;
        let timer = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.connect(audioCtx.destination);
                masterGain.gain.setValueAtTime(document.getElementById('volume').value, audioCtx.currentTime);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // Live Volume Control
        document.getElementById('volume').addEventListener('input', (e) => {
            initAudio();
            const v = parseFloat(e.target.value);
            document.getElementById('volDisp').innerText = Math.round(v * 100) + '%';
            if (masterGain) {
                // Smooth ramp to prevent clicking sounds while sliding
                masterGain.gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
            }
        });

        function stopTone() {
            if (activeOsc) {
                activeOsc.stop();
                activeOsc.disconnect();
                activeOsc = null;
            }
            if (timer) clearTimeout(timer);
            currentHz = null;
            document.querySelectorAll('.freq-btn').forEach(b => b.classList.remove('is-active'));
            document.getElementById('statusBox').classList.remove('active');
            document.getElementById('statusTxt').innerText = 'Standby';
            document.getElementById('stopBtn').style.display = 'none';
        }

        function playTone(hz) {
            initAudio();
            if (currentHz === hz) { stopTone(); return; }
            stopTone();

            activeOsc = audioCtx.createOscillator();
            activeOsc.type = 'sine';
            activeOsc.frequency.setValueAtTime(hz, audioCtx.currentTime);
            activeOsc.connect(masterGain);
            activeOsc.start();

            currentHz = hz;
            document.getElementById('statusBox').classList.add('active');
            document.getElementById('statusTxt').innerText = hz + 'Hz Playing';
            document.getElementById('stopBtn').style.display = 'block';

            // Timer
            const d = document.getElementById('duration').value;
            if (d !== 'continuous') {
                timer = setTimeout(stopTone, parseFloat(d) * 1000);
            }
            
            // Highlight the correct button
            updateHighlights();
        }

        function updateHighlights() {
            document.querySelectorAll('.freq-btn').forEach(btn => {
                const btnHz = parseFloat(btn.dataset.hz);
                if (btnHz === currentHz) btn.classList.add('is-active');
                else btn.classList.remove('is-active');
            });
        }

        // --- DATA & SEARCH ---
        const solfeggio = [
            { "name": "Solfeggio 528 Hz", "description": "DNA Repair & Miracles", "frequencies": [528] },
            { "name": "Solfeggio 963 Hz", "description": "Divine Consciousness", "frequencies": [963] },
            { "name": "Hives Relief", "description": "Frequencies for skin rash and urticaria", "frequencies": [1800, 880, 787, 727, 522, 146, 4.9] }
        ];

        let db = [];
        let history = JSON.parse(localStorage.getItem('rife_history')) || [];

        async function init() {
            try {
                const res = await fetch('frequencies.json');
                const json = await res.json();
                db = [...solfeggio, ...json];
            } catch (e) { db = solfeggio; }
            render(db);
            updateHistoryUI();
        }

        function render(data) {
            const container = document.getElementById('results');
            container.innerHTML = data.map(item => `
                <div class="card">
                    <h3>${item.name}</h3>
                    <p>${item.description || ''}</p>
                    <div class="freq-grid">
                        ${(item.frequencies || []).map(f => `
                            <button class="freq-btn ${currentHz === f ? 'is-active' : ''}" 
                                    data-hz="${f}" 
                                    onclick="playTone(${f})">
                                ${f}Hz
                            </button>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const t = e.target.value.toLowerCase().trim();
            const filtered = db.filter(i => {
                const s = `${i.name} ${i.description} ${(i.keywords || []).join(' ')} ${(i.frequencies || []).join(' ')}`.toLowerCase();
                return s.includes(t);
            });
            render(filtered);
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.value.trim() !== '') {
                const val = e.target.value.trim();
                if (!history.includes(val)) {
                    history.unshift(val);
                    history = history.slice(0, 8);
                    localStorage.setItem('rife_history', JSON.stringify(history));
                    updateHistoryUI();
                }
            }
        });

        function updateHistoryUI() {
            document.getElementById('historyBar').innerHTML = history.map(h => `<span class="history-item" onclick="quickSearch('${h}')">${h}</span>`).join('');
        }

        function quickSearch(t) {
            document.getElementById('searchInput').value = t;
            document.getElementById('searchInput').dispatchEvent(new Event('input'));
        }

        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            document.getElementById('darkToggle').innerText = isDark ? '☀️ Light' : '🌙 Dark';
            localStorage.setItem('rife_theme', isDark ? 'dark' : 'light');
        }
        if (localStorage.getItem('rife_theme') === 'dark') toggleDarkMode();

        init();
    </script>
</body>
</html>
