<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rife Pro Explorer | Precision Generator</title>
    <style>
        :root { --primary: #6366f1; --bg: #ffffff; --card-bg: #f8fafc; --text: #1e293b; --sub-text: #64748b; --border: #e2e8f0; --pill-bg: #e0e7ff; --pill-text: #4338ca; }
        body.dark-mode { --bg: #0f172a; --card-bg: #1e293b; --text: #f1f5f9; --sub-text: #94a3b8; --border: #334155; --pill-bg: #312e81; --pill-text: #e0e7ff; }
        body { font-family: -apple-system, system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }
        
        .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .btn { padding: 10px 16px; border-radius: 10px; cursor: pointer; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-weight: 600; text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-support { background: #635bff; color: white; border: none; }
        .btn-support:hover { opacity: 0.9; }
        
        /* Dashboard Controls */
        .controls-row { display: flex; gap: 20px; background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); align-items: center; flex-wrap: wrap; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; font-weight: bold; color: var(--sub-text); text-transform: uppercase; letter-spacing: 0.05em; }
        select, input[type="range"] { padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }

        .search-box { width: 100%; padding: 16px; font-size: 18px; border: 2px solid var(--border); border-radius: 14px; background: var(--card-bg); color: var(--text); margin-bottom: 8px; box-sizing: border-box; }
        .history-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; font-size: 0.85rem; }
        .history-item { background: var(--border); padding: 4px 12px; border-radius: 20px; cursor: pointer; white-space: nowrap; color: var(--sub-text); border: 1px solid transparent; }
        .history-item:hover { border-color: var(--primary); color: var(--primary); }
        
        .card { background: var(--card-bg); border-radius: 14px; padding: 20px; margin-bottom: 15px; border: 1px solid var(--border); }
        .freq-btn { display: inline-block; background: var(--pill-bg); color: var(--pill-text); padding: 10px 15px; border-radius: 8px; margin: 5px 5px 5px 0; font-family: monospace; font-weight: bold; cursor: pointer; border: none; font-size: 14px; transition: transform 0.1s; }
        .freq-btn:hover { filter: brightness(0.95); transform: scale(1.03); }
        
        .status-container { display: flex; align-items: center; gap: 10px; min-width: 220px; }
        .status-msg { font-size: 13px; color: var(--primary); font-weight: 600; }
        .stop-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; display: none; }

        .disclaimer { font-size: 0.7rem; color: var(--sub-text); text-align: center; margin-top: 50px; opacity: 0.7; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="nav-header">
        <h2 style="margin:0">Rife Pro</h2>
        <div style="display:flex; gap:10px;">
            <button class="btn" onclick="toggleDarkMode()" id="darkToggle">🌙 Mode</button>
            <a href="https://buy.stripe.com/7sYdRbglJcHk3s6fzQ8ww01" target="_blank" class="btn btn-support">
                Support
            </a>
        </div>
    </div>

    <div class="controls-row">
        <div class="control-group">
            <label>Master Volume</label>
            <input type="range" id="volume" min="0" max="1" step="0.05" value="0.5">
        </div>
        <div class="control-group">
            <label>Timer</label>
            <select id="duration">
                <option value="continuous" selected>Continuous</option>
                <option value="30">30 Seconds</option>
                <option value="600">10 Minutes</option>
                <option value="1200">20 Minutes</option>
                <option value="1800">30 Minutes</option>
            </select>
        </div>
        <div class="control-group">
            <label>Signal Status</label>
            <div class="status-container">
                <div id="status" class="status-msg">System Ready</div>
                <button id="stopBtn" class="stop-btn" onclick="stopTone()">STOP SIGNAL</button>
            </div>
        </div>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="Search conditions, Hz, or keywords (e.g. '963', 'Hives')...">
    <div id="historyBar" class="history-bar"></div>
    <div id="results"></div>

    <div class="disclaimer">
        <b>Disclaimer:</b> Experimental Sine Wave Generator. For research purposes only. 
        Not intended to diagnose, treat, or cure any medical condition.
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let currentOsc = null;
        let currentGain = null;

        // Static Library: Solfeggios + Hives
        const staticData = [
            { "name": "Solfeggio: 174 Hz", "description": "Foundation / Pain Reduction", "frequencies": [174], "keywords": ["pain"] },
            { "name": "Solfeggio: 285 Hz", "description": "Quantum Cognition / Healing Tissue", "frequencies": [285], "keywords": ["healing"] },
            { "name": "Solfeggio: 396 Hz", "description": "Liberating Guilt and Fear", "frequencies": [396], "keywords": ["fear"] },
            { "name": "Solfeggio: 417 Hz", "description": "Undoing Situations / Change", "frequencies": [417], "keywords": ["change"] },
            { "name": "Solfeggio: 528 Hz", "description": "DNA Repair / Miracles", "frequencies": [528], "keywords": ["dna", "miracle"] },
            { "name": "Solfeggio: 639 Hz", "description": "Connecting / Relationships", "frequencies": [639], "keywords": ["love"] },
            { "name": "Solfeggio: 741 Hz", "description": "Awakening Intuition / Cleansing", "frequencies": [741], "keywords": ["intuition"] },
            { "name": "Solfeggio: 852 Hz", "description": "Return to Spiritual Order", "frequencies": [852], "keywords": ["spiritual"] },
            { "name": "Solfeggio: 963 Hz", "description": "Pure Spirit / Return to Oneness", "frequencies": [963], "keywords": ["spirit", "oneness", "crown"] },
            { "name": "Hives", "description": "Urticaria / Skin Rash relief", "frequencies": [1800, 880, 787, 727, 522, 146, 4.9], "keywords": ["hives", "rash", "urticaria", "skin"] }
        ];

        let db = [];
        let history = JSON.parse(localStorage.getItem('rife_history')) || [];

        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            document.getElementById('darkToggle').innerText = isDark ? '☀️ Light' : '🌙 Dark';
            localStorage.setItem('rife_theme', isDark ? 'dark' : 'light');
        }
        if (localStorage.getItem('rife_theme') === 'dark') toggleDarkMode();

        function stopTone() {
            if (currentOsc) {
                // Smooth ramp down to prevent audio artifacts
                currentGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
                currentOsc.stop(audioCtx.currentTime + 0.2);
                currentOsc = null;
            }
            document.getElementById('status').innerText = 'System Ready';
            document.getElementById('stopBtn').style.display = 'none';
        }

        function playTone(freq) {
            stopTone();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            currentOsc = audioCtx.createOscillator();
            currentGain = audioCtx.createGain();
            
            const durValue = document.getElementById('duration').value;
            const vol = parseFloat(document.getElementById('volume').value);

            currentOsc.type = 'sine';
            currentOsc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            currentGain.gain.setValueAtTime(vol, audioCtx.currentTime);

            currentOsc.connect(currentGain);
            currentGain.connect(audioCtx.destination);
            currentOsc.start();

            document.getElementById('status').innerText = `Running: ${freq}Hz`;
            document.getElementById('stopBtn').style.display = 'inline-block';

            if (durValue !== 'continuous') {
                const dur = parseFloat(durValue);
                currentGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                currentOsc.stop(audioCtx.currentTime + dur);
                setTimeout(() => { if(currentOsc === null) return; stopTone(); }, dur * 1000);
            }
        }

        async function init() {
            try {
                const res = await fetch('frequencies.json');
                const jsonData = await res.json();
                db = [...staticData, ...jsonData];
            } catch (e) { db = staticData; }
            render(db);
            updateHistoryUI();
        }

        function render(data) {
            const container = document.getElementById('results');
            if(data.length === 0) {
                container.innerHTML = "<p style='text-align:center; padding:20px;'>No frequencies found.</p>";
                return;
            }
            container.innerHTML = data.map(item => `
                <div class="card">
                    <h3 style="margin:0 0 5px 0; color:var(--primary)">${item.name}</h3>
                    <div style="font-size:0.85rem; color:var(--sub-text); margin-bottom:12px;">${item.description || ''}</div>
                    <div style="display:flex; flex-wrap:wrap;">
                        ${(item.frequencies || []).map(f => `<button class="freq-btn" onclick="playTone(${f})">${f}Hz</button>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        // Bulletproof Search Logic
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const filtered = db.filter(i => {
                const searchStr = [
                    i.name,
                    i.description,
                    (i.keywords || []).join(' '),
                    (i.frequencies || []).join(' ')
                ].join(' ').toLowerCase();
                return searchStr.includes(term);
            });
            render(filtered);
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.value.trim() !== '') {
                const val = e.target.value.trim();
                if (!history.includes(val)) {
                    history.unshift(val);
                    history = history.slice(0, 6);
                    localStorage.setItem('rife_history', JSON.stringify(history));
                    updateHistoryUI();
                }
            }
        });

        function updateHistoryUI() {
            document.getElementById('historyBar').innerHTML = history.map(h => 
                `<span class="history-item" onclick="runHistory('${h}')">🕒 ${h}</span>`
            ).join('');
        }

        function runHistory(term) {
            document.getElementById('searchInput').value = term;
            document.getElementById('searchInput').dispatchEvent(new Event('input'));
        }

        init();
    </script>
</body>
</html>
