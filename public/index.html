<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rife Frequency Pro</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #ffffff;
            --card-bg: #ffffff;
            --text: #1e293b;
            --sub-text: #64748b;
            --border: #e2e8f0;
            --pill-bg: #eff6ff;
            --pill-text: #1e40af;
        }

        /* Dark Mode Variables */
        body.dark-mode {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --sub-text: #94a3b8;
            --border: #334155;
            --pill-bg: #1e3a8a;
            --pill-text: #dbeafe;
        }

        body { 
            font-family: -apple-system, sans-serif; 
            max-width: 800px; 
            margin: 0 auto; 
            padding: 20px; 
            background: var(--bg); 
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-pay {
            background: #ffdd00; /* PayPal/Coffee Yellow */
            color: #000;
            border: none;
        }

        .search-box { 
            width: 100%; 
            padding: 15px; 
            font-size: 18px; 
            border: 2px solid var(--border); 
            border-radius: 12px; 
            background: var(--card-bg);
            color: var(--text);
            margin-bottom: 20px;
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 15px; 
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .freq-pill { 
            display: inline-block;
            background: var(--pill-bg); 
            color: var(--pill-text); 
            padding: 4px 10px; 
            border-radius: 6px; 
            margin: 4px;
            font-size: 0.85rem;
            font-family: monospace;
        }

        .description { display: block; margin: 10px 0; color: var(--sub-text); font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <h2>Rife Explorer</h2>
        <div style="display: flex; gap: 10px;">
            <button class="btn" onclick="toggleDarkMode()" id="darkToggle">🌙 Dark Mode</button>
            <a href="https://www.paypal.com/donate" target="_blank" class="btn btn-pay">☕ Support Project</a>
        </div>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="Search conditions or frequency (e.g. '880')...">

    <div id="results"></div>

    <script>
        let frequencyData = [];

        // Dark Mode Logic
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('darkToggle').innerText = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Load saved theme
        if (localStorage.getItem('theme') === 'dark') toggleDarkMode();

        // Load Data
        async function loadData() {
            try {
                const response = await fetch('frequencies.json');
                frequencyData = await response.json();
                render(frequencyData);
            } catch (e) {
                document.getElementById('results').innerHTML = "Error loading frequencies.json";
            }
        }

        function render(items) {
            const container = document.getElementById('results');
            container.innerHTML = items.map(item => `
                <div class="card">
                    <h3 style="margin:0">${item.name}</h3>
                    <span class="description">${item.description || 'No specific notes.'}</span>
                    <div>${item.frequencies.map(f => `<span class="freq-pill">${f} Hz</span>`).join('')}</div>
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = frequencyData.filter(i => 
                i.name.toLowerCase().includes(term) || 
                i.frequencies.some(f => f.toString().includes(term))
            );
            render(filtered);
        });

        loadData();
    </script>
</body>
</html>
