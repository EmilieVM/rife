<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rife Frequency Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .frequency-card { transition: all 0.2s ease; }
        .frequency-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        body { background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-900 font-sans">

    <header class="bg-indigo-800 text-white p-8 shadow-md">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-4xl font-extrabold tracking-tight">Rife Frequency Finder</h1>
            <p class="mt-2 text-indigo-100 text-lg">Instant access to specialized frequency data.</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6">
        <div class="relative mb-10">
            <input type="text" id="searchInput" placeholder="Search conditions (e.g. 'Inflammation', 'Pain', 'Solfeggio')..." 
                class="w-full p-5 pl-6 rounded-2xl border-0 shadow-xl focus:ring-4 focus:ring-indigo-500/20 text-xl outline-none">
        </div>

        <div id="results" class="grid gap-6">
            <div class="text-center py-20 text-slate-400">
                <p class="text-xl">Initializing frequency database...</p>
            </div>
        </div>
    </main>

    <script>
        let frequenciesData = [];
        const resultsContainer = document.getElementById('results');
        const searchInput = document.getElementById('searchInput');

        // 1. Load your frequencies.json
        async function loadData() {
            try {
                // Since frequencies.json is in the same 'public' folder:
                const response = await fetch('frequencies.json');
                if (!response.ok) throw new Error('File not found');
                frequenciesData = await response.json();
                renderResults(frequenciesData);
            } catch (err) {
                resultsContainer.innerHTML = `
                    <div class="bg-red-50 p-6 rounded-xl border border-red-200 text-red-700">
                        <strong>Error:</strong> Could not load frequencies.json. <br>
                        Make sure the file is inside the <strong>public</strong> folder.
                    </div>`;
            }
        }

        // 2. Display the frequency cards
        function renderResults(data) {
            resultsContainer.innerHTML = '';
            
            if (data.length === 0) {
                resultsContainer.innerHTML = '<p class="text-center text-slate-500 text-lg mt-10">No matches found. Try a different term.</p>';
                return;
            }

            // Showing first 100 results for performance
            data.slice(0, 100).forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-2xl border border-slate-200 frequency-card";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <h2 class="text-2xl font-bold text-slate-800">${item.name}</h2>
                        <span class="text-[10px] font-black px-2 py-1 bg-slate-100 text-slate-500 rounded-full uppercase tracking-widest border border-slate-200">${item.source}</span>
                    </div>
                    <p class="text-slate-500 italic mb-5 leading-relaxed">${item.description || 'No specific description provided.'}</p>
                    <div class="flex flex-wrap gap-2">
                        ${item.frequencies.map(f => `
                            <button onclick="playTone(${f})" class="px-4 py-2 bg-indigo-50 text-indigo-700 hover:bg-indigo-600 hover:text-white rounded-lg text-sm font-bold transition-all border border-indigo-100">
                                ${f} Hz
                            </button>
                        `).join('')}
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        }

        // 3. Search logic
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = frequenciesData.filter(item => 
                item.name.toLowerCase().includes(term) || 
                (item.keywords && item.keywords.some(k => k.toLowerCase().includes(term)))
            );
            renderResults(filtered);
        });

        // 4. Tone Generator (Audio Logic)
        let audioCtx = null;
        function playTone(freq) {
            // Create audio context on first click
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // Volume control: Start soft and fade out
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); 
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 2); // Plays for 2 seconds
        }

        loadData();
    </script>
</body>
</html>
