<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rife Frequency Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .frequency-card { transition: all 0.2s ease; }
        .frequency-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        .btn-active { 
            background-color: #10b981 !important; 
            color: white !important;
            border-color: #059669 !important;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
        }

        /* Dark Mode Core */
        body.dark-mode { background-color: #0f172a; color: #f8fafc; }
        .dark-mode .bg-white { background-color: #1e293b !important; color: #f8fafc; border-color: #334155; }
        .dark-mode .text-slate-800 { color: #f1f5f9; }
        .dark-mode .text-slate-500 { color: #94a3b8; }
        .dark-mode input, .dark-mode select { background-color: #0f172a; color: white; border: 1px solid #475569; }
        .dark-mode .bg-indigo-50 { background-color: #312e81; color: #e0e7ff; border-color: #4338ca; }
        .dark-mode header { background-color: #1e1b4b; }
        
        /* High Contrast History Buttons (Dark Mode) */
        .dark-mode .history-pill { 
            background-color: #312e81; 
            color: #c7d2fe; 
            border: 1px solid #4338ca;
        }
        .dark-mode .history-pill:hover { background-color: #4338ca; color: white; }
        .dark-mode .btn-active { background-color: #6366f1 !important; border-color: #818cf8 !important; }
    </style>
</head>
<body class="text-slate-900 font-sans transition-colors duration-300">

    <header class="bg-indigo-900 text-white p-8 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-4xl font-extrabold tracking-tight">Rife Frequency Finder</h1>
                <p class="mt-2 text-indigo-100 text-lg">Tone Generator & Search</p>
            </div>
            <button onclick="toggleDarkMode()" class="p-3 rounded-full bg-indigo-800 hover:bg-indigo-700 border border-indigo-500 transition-all shadow-lg">
                <span id="darkIcon">🌙</span>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6">
        <div class="mb-2">
            <input type="text" id="searchInput" placeholder="Search conditions (e.g. 'Pain', 'Detox')..." 
                class="w-full p-5 rounded-2xl border-0 shadow-xl focus:ring-4 focus:ring-indigo-500/20 text-xl outline-none transition-all">
        </div>

        <div class="flex items-center justify-between mb-6 px-1">
            <div id="historyContainer" class="flex flex-wrap gap-2"></div>
            <button onclick="clearHistory()" id="clearHistoryBtn" class="hidden text-xs font-bold text-slate-400 hover:text-red-500 uppercase tracking-widest ml-4 transition-colors">
                Clear ×
            </button>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-lg border border-slate-200 mb-8 flex flex-wrap gap-8 items-center">
            <div class="flex flex-col">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Live Volume</label>
                <input type="range" id="volumeControl" min="0" max="0.5" step="0.01" value="0.1" class="w-36 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
            </div>
            <div class="flex flex-col">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Duration</label>
                <select id="durationControl" class="bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm font-bold outline-none">
                    <option value="0" selected>Continuous</option>
                    <option value="30">30 Seconds</option>
                    <option value="60">1 Minute</option>
                    <option value="600">10 Minutes</option>
                    <option value="1200">20 Minutes</option>
                    <option value="1800">30 Minutes</option>
                </select>
            </div>
            <button onclick="stopAllTones()" class="ml-auto bg-red-50 text-red-600 px-6 py-3 rounded-xl font-black text-xs uppercase tracking-widest hover:bg-red-600 hover:text-white transition-all shadow-sm">
                STOP AUDIO
            </button>
        </div>

        <div id="results" class="grid gap-6">
            <div class="text-center py-20 text-slate-400 font-medium">Loading database...</div>
        </div>
    </main>

    <script>
        let frequenciesData = [];
        let audioCtx = null;
        let activeOscillator = null;
        let activeGain = null;
        let currentlyPlayingBtn = null;
        let searchHistory = JSON.parse(localStorage.getItem('searchHistory')) || [];

        const resultsContainer = document.getElementById('results');
        const searchInput = document.getElementById('searchInput');
        const volumeControl = document.getElementById('volumeControl');
        const durationControl = document.getElementById('durationControl');
        const historyContainer = document.getElementById('historyContainer');
        const clearBtn = document.getElementById('clearHistoryBtn');

        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            document.getElementById('darkIcon').innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('darkIcon').innerText = '☀️';
        }

        function updateHistoryUI() {
            if (searchHistory.length > 0) {
                clearBtn.classList.remove('hidden');
                historyContainer.innerHTML = searchHistory.map(term => `
                    <button onclick="applySearch('${term}')" class="history-pill px-4 py-1.5 bg-slate-200 rounded
