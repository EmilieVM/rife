<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rife Pro | Universal Precision</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }
        body.dark-mode {
            --bg: #020617; --card: #0f172a; --text: #f1f5f9; --border: #1e293b;
        }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            max-width: 600px; margin: 0 auto; padding: 20px; 
            background: var(--bg); color: var(--text); line-height: 1.5;
        }
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        /* Volume & Controls */
        .master-controls { 
            background: var(--card); border: 2px solid var(--primary); 
            padding: 20px; border-radius: 16px; margin-bottom: 25px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .vol-row { display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; margin-bottom: 10px; color: var(--primary); }
        input[type="range"] { width: 100%; height: 15px; accent-color: var(--primary); cursor: pointer; margin-bottom: 15px; }

        /* Search & UI */
        .search-box { 
            width: 100%; padding: 15px; border-radius: 12px; border: 2px solid var(--border);
            background: var(--card); color: var(--text); font-size: 16px; margin-bottom: 20px; box-sizing: border-box;
            outline: none;
        }
        .search-box:focus { border-color: var(--primary); }

        .card { background: var(--card); border: 1px solid var(--border); padding: 18px; border-radius: 14px; margin-bottom: 15px; }
        .card h3 { margin: 0 0 5px 0; font-size: 18px; }
        .card p { margin: 0 0 15px 0; font-size: 13px; opacity: 0.7; }
        
        .freq-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .freq-btn { 
            padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-weight: 700; cursor: pointer;
            transition: all 0.2s ease; font-family: monospace;
        }

        /* HIGHLIGHT FIX: Indigo glow for active frequency */
        .freq-btn.is-playing { 
            background: var(--primary) !important; color: white !important;
            border-color: var(--primary); box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
        }

        .status-panel { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .btn-stop { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 900; cursor: pointer; display: none; }
        .status-txt { font-size: 12px; font-weight: bold; }

        .disclaimer { font-size: 10px; text-align: center; margin-top: 40px; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="nav">
        <h1 style="margin:0; font-size: 24px; letter-spacing: -1px;">RIFE PRO</h1>
        <button onclick="document.body.classList.toggle('dark-mode')" class="freq-btn">🌓 Mode</button>
    </div>

    <div class="master-controls">
        <div class="vol-row">
            <span>MASTER VOLUME</span>
            <span id="volPercent">50%</span>
        </div>
        <input type="range" id="masterVol" min="0" max="1" step="0.01" value="0.5">
        
        <div class="status-panel">
            <span id="statusLabel" class="status-txt">SYSTEM READY</span>
            <button id="stopBtn" class="btn-stop" onclick="killSignal()">STOP SIGNAL</button>
        </div>
    </div>

    <input type="text" id="searchField" class="search-box" placeholder="Search (e.g. Abdominal, Hives, 528)...">

    <div id="results"></div>

    <p class="disclaimer">Experimental Sine Tool. Frequencies under 40Hz may be silent on phone speakers.</p>

    <script>
        // --- THE ENGINE ---
        let audioCtx = null;
        let masterGainNode = null;
        let activeOscillator = null;
        let currentActiveHz = null;

        // Force Audio Initialization
        function setupAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGainNode = audioCtx.createGain();
                masterGainNode.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Handle Volume Slider
        const slider = document.getElementById('masterVol');
        const percent = document.getElementById('volPercent');

        slider.addEventListener('input', (e) => {
            setupAudio(); // Ensure engine stays awake
            const val = e.target.value;
            percent.innerText = Math.round(val * 100) + '%';
            
            if (masterGainNode) {
                // Use .value for instant hardware response
                masterGainNode.gain.value = val;
            }
        });

        function killSignal() {
            if (activeOscillator) {
                activeOscillator.stop();
                activeOscillator.disconnect();
                activeOscillator = null;
            }
            currentActiveHz = null;
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('statusLabel').innerText = 'SIGNAL STOPPED';
            // Clear all highlights
            document.querySelectorAll('.freq-btn').forEach(b => b.classList.remove('is-playing'));
        }

        function playHz(hz) {
            setupAudio(); // Resume on every click

            // Toggle logic: If clicking the same one, stop it.
            if (currentActiveHz === hz) {
                killSignal();
                return;
            }

            killSignal(); // Stop anything else playing

            activeOscillator = audioCtx.createOscillator();
            activeOscillator.type = 'sine';
            activeOscillator.frequency.value = hz;
            
            // Connect to our global fader
            activeOscillator.connect(masterGainNode);
            
            // SYNC FIX: Re-apply the current slider value to the gain node
            masterGainNode.gain.value = slider.value;
            
            activeOscillator.start();
            currentActiveHz = hz;

            // UI Feedback
            document.getElementById('stopBtn').style.display = 'block';
            document.getElementById('statusLabel').innerText = 'PLAYING: ' + hz + ' HZ';
            
            // HIGHLIGHT FIX: Find the button across the whole document
            updateHighlights();
        }

        function updateHighlights() {
            document.querySelectorAll('.freq-btn').forEach(btn => {
                if (parseFloat(btn.innerText) === currentActiveHz) {
                    btn.classList.add('is-playing');
                } else {
                    btn.classList.remove('is-playing');
                }
            });
        }

        // --- DATA & SEARCH ---
        let mainData = [];

        async function init() {
            try {
                const res = await fetch('frequencies.json');
                mainData = await res.json();
            } catch(e) {
                // Fallback basic data
                mainData = [
                    { name: "Solfeggio 528", frequencies: [528], description: "Transformation & Miracles" },
                    { name: "Hives Protocol", frequencies: [1800, 880, 787, 727, 4.9], description: "Allergy/Skin rash" }
                ];
            }
            render(mainData);
        }

        function render(data) {
            const container = document.getElementById('results');
            container.innerHTML = data.map(item => `
                <div class="card">
                    <h3>${item.name}</h3>
                    <p>${item.description || ''}</p>
                    <div class="freq-grid">
                        ${item.frequencies.map(f => `
                            <button class="freq-btn ${currentActiveHz === f ? 'is-playing' : ''}" 
                                    onclick="playHz(${f})">
                                ${f}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('searchField').addEventListener('input', (e) => {
            const t = e.target.value.toLowerCase();
            const filtered = mainData.filter(i => 
                i.name.toLowerCase().includes(t) || 
                (i.keywords && i.keywords.some(k => k.toLowerCase().includes(t)))
            );
            render(filtered);
            updateHighlights(); // Ensure highlights persist after filtering
        });

        init();
    </script>
</body>
</html>
